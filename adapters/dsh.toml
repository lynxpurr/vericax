# dsh adapter (spec/08 section 5, D1): one-shot headless profile.
# dsh --profile headless answers one task and exits; `-` reads the task from
# stdin, so the instruction is piped rather than passed as argv.
name = "dsh"
version = "0.2.1-rc.5"

[launch]
command = ["dsh", "--profile", "headless", "--json"]
instruction = "stdin"
approval = []
grace_seconds = 10

[sandbox]
shell = "path"
shell_target = "vericax-sh"
file_tools = "disable"
working_dir = "/home/user/Desktop"

[output]
format = "json"
# dsh --json emits NDJSON run events; usage objects are summed by cost_path.
cost_path = "usage"

[state]
dir = ".dsh"

[model]
name = "deepseek"
endpoint = "deepseek-official"

[container]
image = "vericax-agent:phase1"
# credentials are injected at run time from the host environment, never baked
env_from = ["DEEPSEEK_API_KEY"]
