<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
  <style>
    .line { stroke: #111; stroke-width: 2; fill: none; }
    .thin { stroke: #111; stroke-width: 1; fill: none; }
    .dash { stroke: #555; stroke-width: 1; stroke-dasharray: 6 4; fill: none; }
    .beam { fill: #cfd8dc; stroke: #111; stroke-width: 2; }
    text { font-family: DejaVu Sans, Arial, sans-serif; font-size: 16px; fill: #111; }
    .dim { font-size: 15px; }
    .note { font-size: 13px; fill: #333; }
  </style>

  <!-- fixed wall -->
  <rect x="80" y="90" width="20" height="120" fill="#90a4ae" stroke="#111" stroke-width="2"/>
  <g class="thin">
    <line x1="80" y1="95" x2="70" y2="105"/>
    <line x1="80" y1="110" x2="70" y2="120"/>
    <line x1="80" y1="125" x2="70" y2="135"/>
    <line x1="80" y1="140" x2="70" y2="150"/>
    <line x1="80" y1="155" x2="70" y2="165"/>
    <line x1="80" y1="170" x2="70" y2="180"/>
    <line x1="80" y1="185" x2="70" y2="195"/>
    <line x1="80" y1="200" x2="70" y2="210"/>
  </g>

  <!-- stepped beam: 5 px per mm; root 70 mm, tip 50 mm; 12 and 8 mm heights -->
  <rect class="beam" x="100" y="120" width="350" height="60"/>
  <rect class="beam" x="450" y="130" width="250" height="40"/>

  <!-- centerline -->
  <line class="dash" x1="100" y1="150" x2="720" y2="150"/>

  <!-- total length dimension -->
  <line class="thin" x1="100" y1="235" x2="700" y2="235"/>
  <line class="thin" x1="100" y1="225" x2="100" y2="245"/>
  <line class="thin" x1="700" y1="225" x2="700" y2="245"/>
  <text class="dim" x="380" y="228" text-anchor="middle">120</text>

  <!-- root length dimension -->
  <line class="thin" x1="100" y1="205" x2="450" y2="205"/>
  <line class="thin" x1="100" y1="198" x2="100" y2="212"/>
  <line class="thin" x1="450" y1="198" x2="450" y2="212"/>
  <text class="dim" x="275" y="199" text-anchor="middle">70</text>

  <!-- root height -->
  <line class="thin" x1="455" y1="120" x2="475" y2="120"/>
  <line class="thin" x1="455" y1="180" x2="475" y2="180"/>
  <line class="thin" x1="465" y1="120" x2="465" y2="180"/>
  <text class="dim" x="480" y="155">12</text>

  <!-- tip height -->
  <line class="thin" x1="705" y1="130" x2="725" y2="130"/>
  <line class="thin" x1="705" y1="170" x2="725" y2="170"/>
  <line class="thin" x1="715" y1="130" x2="715" y2="170"/>
  <text class="dim" x="730" y="155">8</text>

  <!-- tip load -->
  <line class="line" x1="700" y1="60" x2="700" y2="120"/>
  <polygon points="700,125 693,108 707,108" fill="#111"/>
  <text class="dim" x="710" y="75">80 N</text>

  <text class="note" x="100" y="280">Stepped cantilever, side view. All dimensions in mm.</text>
  <text class="note" x="100" y="300">Root section 12 x 12, tip section 8 x 8 (square, out of plane thickness given by the sections).</text>
</svg>