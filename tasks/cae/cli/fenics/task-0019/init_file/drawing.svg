<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560">
  <style>
    .outline { fill: #e3f2fd; stroke: #0d47a1; stroke-width: 2; }
    .hole { fill: #ffffff; stroke: #0d47a1; stroke-width: 2; }
    .dim { stroke: #333; stroke-width: 1; fill: none; }
    .centre { stroke: #777; stroke-width: 1; stroke-dasharray: 12 4 2 4; fill: none; }
    .support { stroke: #333; stroke-width: 1.5; fill: none; }
    .hatch { stroke: #333; stroke-width: 1; fill: none; }
    .roller { fill: #ffffff; stroke: #333; stroke-width: 1; }
    .leader { stroke: #333; stroke-width: 1; fill: none; }
    .arrow { fill: #333; stroke: none; }
    .load { stroke: #c62828; stroke-width: 2.5; fill: none; }
    .load-head { fill: #c62828; stroke: none; }
    .ref { stroke: #c62828; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
    .axis { stroke: #2e7d32; stroke-width: 1.5; fill: none; }
    .axis-head { fill: #2e7d32; stroke: none; }
    .frame { fill: #fafafa; stroke: #333; stroke-width: 1.5; }
    .frame-line { stroke: #333; stroke-width: 1; fill: none; }
    text { font-family: sans-serif; font-size: 16px; fill: #111; }
    .small { font-size: 14px; }
    .note { font-size: 14px; fill: #333; }
    .title { font-size: 17px; font-weight: bold; }
  </style>

  <!-- plate outline and the two holes -->
  <rect class="outline" x="120" y="60" width="480" height="240"/>
  <circle class="hole" cx="260" cy="180" r="24"/>
  <circle class="hole" cx="460" cy="180" r="12"/>

  <!-- centre lines -->
  <path class="centre" d="M122 180 H230 M290 180 H444 M476 180 H560 M260 38 V150 M260 210 V216 M460 18 V150 M460 198 V204"/>

  <!-- supports -->
  <path class="support" d="M112 72 V294 M132 308 H588"/>
  <path class="hatch" d="M112 76 l-8 -8 M112 88 l-8 -8 M112 100 l-8 -8 M112 112 l-8 -8 M112 124 l-8 -8 M112 136 l-8 -8 M112 148 l-8 -8 M112 160 l-8 -8 M112 172 l-8 -8 M112 184 l-8 -8 M112 196 l-8 -8 M112 208 l-8 -8 M112 220 l-8 -8 M112 232 l-8 -8 M112 244 l-8 -8 M112 256 l-8 -8 M112 268 l-8 -8 M112 280 l-8 -8 M112 292 l-8 -8"/>
  <path class="hatch" d="M136 308 l8 8 M148 308 l8 8 M160 308 l8 8 M172 308 l8 8 M184 308 l8 8 M196 308 l8 8 M208 308 l8 8 M220 308 l8 8 M232 308 l8 8 M244 308 l8 8 M256 308 l8 8 M268 308 l8 8 M280 308 l8 8 M292 308 l8 8 M304 308 l8 8 M316 308 l8 8 M328 308 l8 8 M340 308 l8 8 M352 308 l8 8 M364 308 l8 8 M376 308 l8 8 M388 308 l8 8 M400 308 l8 8 M412 308 l8 8 M424 308 l8 8 M436 308 l8 8 M448 308 l8 8 M460 308 l8 8 M472 308 l8 8 M484 308 l8 8 M496 308 l8 8 M508 308 l8 8 M520 308 l8 8 M532 308 l8 8 M544 308 l8 8 M556 308 l8 8 M568 308 l8 8 M580 308 l8 8"/>
  <g class="roller">
    <circle cx="116" cy="84" r="3"/><circle cx="116" cy="108" r="3"/><circle cx="116" cy="132" r="3"/>
    <circle cx="116" cy="156" r="3"/><circle cx="116" cy="204" r="3"/><circle cx="116" cy="228" r="3"/>
    <circle cx="116" cy="252" r="3"/><circle cx="116" cy="276" r="3"/>
    <circle cx="148" cy="304" r="3"/><circle cx="172" cy="304" r="3"/><circle cx="196" cy="304" r="3"/>
    <circle cx="220" cy="304" r="3"/><circle cx="244" cy="304" r="3"/><circle cx="268" cy="304" r="3"/>
    <circle cx="292" cy="304" r="3"/><circle cx="316" cy="304" r="3"/><circle cx="340" cy="304" r="3"/>
    <circle cx="364" cy="304" r="3"/><circle cx="388" cy="304" r="3"/><circle cx="412" cy="304" r="3"/>
    <circle cx="436" cy="304" r="3"/><circle cx="460" cy="304" r="3"/><circle cx="484" cy="304" r="3"/>
    <circle cx="508" cy="304" r="3"/><circle cx="532" cy="304" r="3"/><circle cx="556" cy="304" r="3"/>
  </g>
  <text class="small" x="96" y="180" text-anchor="middle" transform="rotate(-90 96 180)">ux = 0</text>
  <text class="small" x="360" y="336" text-anchor="middle">uy = 0</text>

  <!-- dimensions -->
  <g class="dim">
    <!-- 70: left edge to the centre of hole A -->
    <line x1="120" y1="56" x2="120" y2="18"/>
    <line x1="120" y1="44" x2="260" y2="44"/>
    <line x1="116" y1="48" x2="124" y2="40"/>
    <line x1="256" y1="48" x2="264" y2="40"/>
    <!-- 170: left edge to the centre of hole B -->
    <line x1="120" y1="24" x2="460" y2="24"/>
    <line x1="116" y1="28" x2="124" y2="20"/>
    <line x1="456" y1="28" x2="464" y2="20"/>
    <!-- 120: plate height -->
    <line x1="114" y1="60" x2="42" y2="60"/>
    <line x1="114" y1="300" x2="42" y2="300"/>
    <line x1="50" y1="60" x2="50" y2="300"/>
    <line x1="46" y1="64" x2="54" y2="56"/>
    <line x1="46" y1="304" x2="54" y2="296"/>
    <!-- 240: plate width -->
    <line x1="120" y1="306" x2="120" y2="380"/>
    <line x1="600" y1="306" x2="600" y2="380"/>
    <line x1="120" y1="372" x2="600" y2="372"/>
    <line x1="116" y1="376" x2="124" y2="368"/>
    <line x1="596" y1="376" x2="604" y2="368"/>
    <!-- 60: bottom edge to the common centre line of the holes -->
    <line x1="552" y1="180" x2="552" y2="300"/>
    <line x1="548" y1="184" x2="556" y2="176"/>
    <line x1="548" y1="304" x2="556" y2="296"/>
  </g>
  <text class="small" x="190" y="39" text-anchor="middle">70</text>
  <text class="small" x="290" y="19" text-anchor="middle">170</text>
  <text class="small" x="36" y="180" text-anchor="middle" transform="rotate(-90 36 180)">120</text>
  <text class="small" x="360" y="391" text-anchor="middle">240</text>
  <text class="small" x="558" y="245">60</text>

  <!-- hole diameters -->
  <polyline class="leader" points="284.042,204.042 300,220 340,220"/>
  <polygon class="arrow" points="276.971,196.971 281.567,206.517 286.517,201.567"/>
  <text class="small" x="320" y="216" text-anchor="middle">Ø24</text>
  <polyline class="leader" points="475.556,164.444 490,150 530,150"/>
  <polygon class="arrow" points="468.485,171.515 478.031,166.919 473.081,161.969"/>
  <text class="small" x="510" y="146" text-anchor="middle">Ø12</text>
  <text x="260" y="185" text-anchor="middle" font-weight="bold">A</text>
  <text x="460" y="185" text-anchor="middle" font-weight="bold">B</text>

  <!-- load -->
  <line class="ref" x1="600" y1="180" x2="670" y2="180"/>
  <path class="ref" d="M636 180 A36 36 0 0 0 631.177 162"/>
  <line class="load" x1="600" y1="180" x2="650.229" y2="151"/>
  <polygon class="load-head" points="660.622,145 647.979,147.103 652.479,154.897"/>
  <text x="612" y="134">F = 36 kN</text>
  <text class="small" x="644" y="172">30°</text>
  <text class="note" x="610" y="206">F ACTS AT MID-HEIGHT OF</text>
  <text class="note" x="610" y="222">THE RIGHT EDGE</text>

  <!-- axes: origin at the lower-left corner of the plate -->
  <line class="axis" x1="120" y1="300" x2="154" y2="300"/>
  <polygon class="axis-head" points="160,300 151,296.5 151,303.5"/>
  <line class="axis" x1="120" y1="300" x2="120" y2="266"/>
  <polygon class="axis-head" points="120,260 116.5,269 123.5,269"/>
  <text class="small" x="164" y="304">x</text>
  <text class="small" x="126" y="258">y</text>

  <!-- title block -->
  <rect class="frame" x="40" y="416" width="800" height="112"/>
  <path class="frame-line" d="M40 444 H840 M40 472 H840 M40 500 H840 M440 444 V528"/>
  <text class="title" x="52" y="436">PLATE WITH TWO CIRCULAR HOLES UNDER AN OBLIQUE EDGE LOAD</text>
  <text x="52" y="464">MATERIAL: E = 210 GPa, ν = 0.3</text>
  <text x="452" y="464">THICKNESS 2 mm</text>
  <text x="52" y="492">ALL DIMENSIONS IN mm</text>
  <text x="452" y="492">FORCES IN kN</text>
  <text x="52" y="520">PLANE STRESS</text>
  <text x="452" y="520">FULL PLATE - NO SYMMETRY</text>
</svg>
