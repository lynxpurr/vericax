name: ci

# NOTE (2026-11-22): while the repository was private this workflow was blocked
# by account-level billing before the first step. The repository is public now
# and the workflow runs on standard runners; scripts/ci_local.sh remains the
# offline replica and pre-push gate. See docs/ci.md.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q scripts tasks vericax tests

      - name: Offline tests
        run: python -m unittest tests.test_validity tests.test_audit_tooling
          tests.test_capability_report tests.test_runtime_reliability

      - name: Task package validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in tasks/*/*/*/task-*; do
            id=$(echo "$dir" | sed 's|^tasks/||; s|/|--|g')
            echo "::group::$id"
            python scripts/pack_task.py --task "$id" --check
            echo "::endgroup::"
          done

      - name: Repository hygiene (secrets, machine paths)
        run: python scripts/check_repo_hygiene.py
