name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q scripts tasks

      - name: Task package validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in tasks/*/*/*/task-*; do
            id=$(echo "$dir" | sed 's|^tasks/||; s|/|--|g')
            echo "::group::$id"
            python scripts/pack_task.py --task "$id" --check
            echo "::endgroup::"
          done

      - name: Repository hygiene (secrets, machine paths)
        run: python scripts/check_repo_hygiene.py
