name: ci

# NOTE (2026-11-22): on a private repository this workflow can fail before step
# 1 with "The job was not started because recent account payments have failed
# or your spending limit needs to be increased." That is an account-level
# billing blocker, not a code failure; the same steps pass locally. Until the
# public `ci` badge is confirmed green, scripts/ci_local.sh is the authoritative
# gate (and the pre-push hook runs it). See docs/ci.md.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q scripts tasks vericax tests

      - name: Offline tests
        run: python -m unittest tests.test_validity tests.test_audit_tooling

      - name: Task package validation
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in tasks/*/*/*/task-*; do
            id=$(echo "$dir" | sed 's|^tasks/||; s|/|--|g')
            echo "::group::$id"
            python scripts/pack_task.py --task "$id" --check
            echo "::endgroup::"
          done

      - name: Repository hygiene (secrets, machine paths)
        run: python scripts/check_repo_hygiene.py
